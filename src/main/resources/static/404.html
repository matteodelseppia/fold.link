<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link not found · foldl.ink</title>
    <meta name="description" content="This short link doesn't exist, has expired, or was never created." />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <h1>foldl<span class="accent">.</span>ink</h1>

        <h2 class="not-found-title">This link doesn't exist</h2>

      </main>
    </div>
  </body>
